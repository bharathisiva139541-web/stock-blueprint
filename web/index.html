<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff">
<title>Stock Blueprint</title>
<meta name="description" content="Stock Blueprint - NSE watchlist research dashboard: strategy-based daily suggestions, industries, patterns & FVG, results season, alerts, backtesting and workbook analysis.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f6fd1'/%3E%3Cpath d='M7 21l6-6 4 4 8-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script>
  // apply the viewer's saved theme before first paint (default: light)
  try { if (localStorage.getItem('sb:theme') === '"dark"') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
</script>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="#overview" aria-label="Stock Blueprint home">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>Stock Blueprint</span>
    </a>
    <div class="global-search" role="search">
      <label class="sr-only" for="gsearch">Search stocks</label>
      <input id="gsearch" type="search" autocomplete="off" placeholder="Search ticker, company, industry" aria-controls="gsearch-results">
      <div id="gsearch-results" class="search-results" role="listbox" hidden></div>
    </div>
    <button id="status" class="status-pill" type="button" aria-label="Data status">Loading…</button>
    <button id="theme" class="icon-btn" type="button" aria-label="Switch light / dark theme" title="Light / dark theme"></button>
  </div>
  <nav class="tabs" aria-label="Sections"></nav>
</header>

<main id="app" tabindex="-1">
  <div class="skeleton" aria-busy="true"><i style="width:40%"></i><i style="width:75%"></i><i style="width:60%"></i></div>
</main>

<div id="drawer" class="drawer" hidden>
  <div class="drawer-back" data-close></div>
  <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <button class="icon-btn drawer-x" type="button" data-close aria-label="Close">✕</button>
    <div id="drawer-body"></div>
  </aside>
</div>
<div id="tip" class="tip" role="status" hidden></div>

<footer class="foot">
  Research and decision-support only - no orders are placed. Data from the Stock Blueprint Google Sheet and, when configured,
  a licensed market-data provider. Prices may be delayed or cached; the status badge shows which. Not investment advice.
</footer>

<script src="data/dashboard.js"></script>
<script src="data/logos.js"></script>
<script src="lib/classify.js"></script>
<script src="lib/indicators.js"></script>
<script src="lib/patterns.js"></script>
<script src="lib/fvg.js"></script>
<script src="lib/risk.js"></script>
<script src="lib/strategy.js"></script>
<script src="lib/backtest.js"></script>
<script src="lib/xlsx-reader.js"></script>
<script src="lib/workbook-analysis.js"></script>
<script src="ui/core.js"></script>
<script src="ui/strategy-state.js"></script>
<script src="ui/stock-drawer.js"></script>
<script src="pages/overview.js"></script>
<script src="pages/watchlist.js"></script>
<script src="pages/suggestions.js"></script>
<script src="pages/industries.js"></script>
<script src="pages/strategy.js"></script>
<script src="pages/signals.js"></script>
<script src="pages/excel.js"></script>
<script src="pages/results.js"></script>
<script src="pages/alerts.js"></script>
<script src="pages/backtest.js"></script>
<script src="pages/markets.js"></script>
<script src="app.js"></script>
</body>
</html>
